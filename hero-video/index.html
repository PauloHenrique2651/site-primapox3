<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Primapox hero loop — ezycolor. Background only: the website overlays its own headline. */
      :root { --ground: #f1f3f6; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .frame { position: absolute; inset: 0; overflow: hidden; }
      .frame img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080" data-layout-allow-overflow>
      <div id="ezycolor-shot-0" class="clip shot" data-start="0" data-duration="12" data-track-index="0" style="z-index:1">
        <div class="frame" id="ezycolor-shot-0-frame"><img id="ezycolor-shot-0-img" src="assets/photo-22.jpg" alt="" /></div>
      </div>
      <div id="ezycolor-shot-1" class="clip shot" data-start="1.6" data-duration="10.4" data-track-index="1" style="z-index:2">
        <div class="frame" id="ezycolor-shot-1-frame"><img id="ezycolor-shot-1-img" src="assets/photo-5.jpg" alt="" /></div>
      </div>
      <div id="ezycolor-shot-2" class="clip shot" data-start="4" data-duration="8" data-track-index="2" style="z-index:3">
        <div class="frame" id="ezycolor-shot-2-frame"><img id="ezycolor-shot-2-img" src="assets/photo-45.jpg" alt="" /></div>
      </div>
      <div id="ezycolor-shot-3" class="clip shot" data-start="6.4" data-duration="5.6" data-track-index="3" style="z-index:4">
        <div class="frame" id="ezycolor-shot-3-frame"><img id="ezycolor-shot-3-img" src="assets/photo-44.jpg" alt="" /></div>
      </div>
      <div id="ezycolor-shot-4" class="clip shot" data-start="8.8" data-duration="3.2" data-track-index="4" style="z-index:5">
        <div class="frame" id="ezycolor-shot-4-frame"><img id="ezycolor-shot-4-img" src="assets/photo-14.jpg" alt="" /></div>
      </div>
      <div id="ezycolor-shot-5" class="clip shot" data-start="11.2" data-duration="0.8" data-track-index="5" style="z-index:6">
        <div class="frame" id="ezycolor-shot-5-frame"><img id="ezycolor-shot-5-img" src="assets/photo-22.jpg" alt="" /></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ezycolor-shot-0-img", { scale: 1.02, xPercent: 0, yPercent: 0 }, { scale: 1.12, xPercent: -2, yPercent: 0, duration: 4, ease: "sine.inOut" }, 0);
      tl.fromTo("#ezycolor-shot-1-img", { scale: 1.02, xPercent: 0, yPercent: 0 }, { scale: 1.12, xPercent: 2, yPercent: 0, duration: 4, ease: "sine.inOut" }, 1.6);
      tl.fromTo("#ezycolor-shot-1-frame", { clipPath: "polygon(0% 0%, 0% 0%, -20% 100%, -20% 100%)" }, { clipPath: "polygon(0% 0%, 120% 0%, 100% 100%, -20% 100%)", duration: 0.8, ease: "power2.inOut" }, 1.6);
      tl.fromTo("#ezycolor-shot-2-img", { scale: 1.02, xPercent: 0, yPercent: 0 }, { scale: 1.12, xPercent: 0, yPercent: -2, duration: 4, ease: "sine.inOut" }, 4);
      tl.fromTo("#ezycolor-shot-2-frame", { clipPath: "polygon(0% 0%, 0% 0%, -20% 100%, -20% 100%)" }, { clipPath: "polygon(0% 0%, 120% 0%, 100% 100%, -20% 100%)", duration: 0.8, ease: "power2.inOut" }, 4);
      tl.fromTo("#ezycolor-shot-3-img", { scale: 1.02, xPercent: 0, yPercent: 0 }, { scale: 1.12, xPercent: -2, yPercent: 0, duration: 4, ease: "sine.inOut" }, 6.4);
      tl.fromTo("#ezycolor-shot-3-frame", { clipPath: "polygon(0% 0%, 0% 0%, -20% 100%, -20% 100%)" }, { clipPath: "polygon(0% 0%, 120% 0%, 100% 100%, -20% 100%)", duration: 0.8, ease: "power2.inOut" }, 6.4);
      tl.fromTo("#ezycolor-shot-4-img", { scale: 1.02, xPercent: 0, yPercent: 0 }, { scale: 1.12, xPercent: 2, yPercent: 1, duration: 3.2, ease: "sine.inOut" }, 8.8);
      tl.fromTo("#ezycolor-shot-4-frame", { clipPath: "polygon(0% 0%, 0% 0%, -20% 100%, -20% 100%)" }, { clipPath: "polygon(0% 0%, 120% 0%, 100% 100%, -20% 100%)", duration: 0.8, ease: "power2.inOut" }, 8.8);
      tl.fromTo("#ezycolor-shot-5-img", { scale: 1.02, xPercent: 0, yPercent: 0 }, { scale: 1.02, xPercent: 0, yPercent: 0, duration: 0.8, ease: "none" }, 11.2);
      tl.fromTo("#ezycolor-shot-5-frame", { clipPath: "polygon(0% 0%, 0% 0%, -20% 100%, -20% 100%)" }, { clipPath: "polygon(0% 0%, 120% 0%, 100% 100%, -20% 100%)", duration: 0.8, ease: "power2.inOut" }, 11.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
